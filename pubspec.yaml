name: islamic_shikkha
description: Offline-first Bangla Islamic education app starter.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  just_audio: ^0.9.42
  google_mobile_ads: ^5.3.1
  geolocator: ^13.0.2
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.3.5
  adhan_dart: ^1.2.0
  in_app_purchase: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/qaida/
    - assets/data/namaz/
    - assets/data/duas/
    - assets/data/surahs/
    - assets/data/quiz/
    - assets/data/districts/
    - assets/audio/qaida/
    - assets/audio/duas/
    - assets/audio/surahs/
    - assets/images/namaz/
    - assets/fonts/

